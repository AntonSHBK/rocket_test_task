<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CheckStock — управление складскими остатками">
    <title>{% block title %}CheckStock{% endblock %} — CheckStock</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/components.css') }}">
    {% block page_styles %}{% endblock %}
</head>
<body data-active-page="{{ active_page }}">
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    {% include "includes/header.html" %}
    {% include "includes/notifications.html" %}
    <main class="site-main" id="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    {% include "includes/footer.html" %}
    <script src="{{ url_for('static', path='/js/api.js') }}" defer></script>
    <script src="{{ url_for('static', path='/js/common.js') }}" defer></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
